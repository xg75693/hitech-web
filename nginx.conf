# 后端 API 反向代理（正常服务配置）
server {
    listen 80;
    server_name ai.hitech.xin www.ai.hitech.xin;

    # 上传文件大小限制
    client_max_body_size 200M;

    # 隐藏 Nginx 版本
    server_tokens off;

    # 根路径重定向到 /hitech/
    location = / {
        return 302 /hitech/;
    }

    # 前端静态文件
    location /static/ {
        access_log /var/log/nginx/static-access.log;
        error_log /var/log/nginx/static-error.log;
        alias /data/hitech/static/;
        index index.html;
        try_files $uri $uri/ /static/index.html;
    }

    # 前端文件
    location /file/ {
        access_log /var/log/nginx/file-access.log;
        error_log /var/log/nginx/file-error.log;
        alias /data/hitech/file/;
        index index.html;
        try_files $uri $uri/ /file/index.html;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ========================================
    # 项目: Hitech.web(和毅官网)
    # 后端端口: 3000
    # 部署节点: node1
    # ========================================

    # 前端静态文件入口（访问 /hitech 重定向到 /hitech/）
    location = /hitech {
        return 301 /hitech/;
    }

    # 前端静态文件入口（访问 /hitech返回 index.html）
    location /hitech {
        access_log /var/log/nginx/hitech-access.log;
        error_log /var/log/nginx/hitech-web-error.log;
        alias /data/hitech/node1/app/hitech-web/dist/index.html;
        default_type text/html;
    }

    # 前端静态文件
    location /hitech/ {
        access_log /var/log/nginx/hitech-web-access.log;
        error_log /var/log/nginx/hitech-web-error.log;
        alias /data/hitech/node1/app/hitech-web/dist/;
        index index.html;
        try_files $uri $uri/ /hitech/index.html;
    }

    # 后端 API 代理（含 AI SSE 流式响应支持）
    location /hitech/api/ {
        access_log /var/log/nginx/hitech-web-access.log;
        error_log /var/log/nginx/hitech-web-error.log;
        proxy_pass http://localhost:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # SSE 流式响应支持（对普通 JSON 接口无负面影响）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 健康检查入口
    location /hitech/health {
        access_log off;
        proxy_pass http://localhost:3000/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ========================================
}